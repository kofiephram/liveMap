<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Vibration - Fixed Car</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
#map{width:100vw;height:100vh}
#car-fixed{
 position:absolute; top:50%; left:50%; z-index:1000;
 transform:translate(-50%,-50%);
 width:50px;height:50px;background:#111;border:3px solid #00e676;
 border-radius:50%; display:flex;align-items:center;justify-content:center;
 font-size:24px; box-shadow:0 4px 20px rgba(0,0,0,0.6);
 pointer-events:none;
}
.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;background:white;padding:12px 20px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div id="loader" class="loader">Loading Harare roads...</div>
<div id="map"></div>
<div id="car-fixed"><div id="carInner">🚖</div></div>

<script>
const map = L.map('map',{zoomControl:false, zoomAnimation:false, fadeAnimation:false, inertia:false}).setView([-17.8252,31.0335],17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let fullRoute=[], routeLine, idx=0, lerp=0, speed=250;
let currentBearing=0, targetBearing=0;

const start=[31.0335,-17.8252], end=[31.075,-17.79];

async function loadRoute(){
  const url=`https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
  try{
    const r=await fetch(url); const j=await r.json();
    // SMOOTH THE ROUTE - remove tiny zigzags that cause backward vibration
    let coords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    // filter points too close (<5m)
    fullRoute=[coords[0]];
    for(let i=1;i<coords.length;i++){
      if(dist(coords[i-1], coords[i])>5) fullRoute.push(coords[i]);
    }
  }catch{ fullRoute=[[-17.8252,31.0335],[-17.82,31.037],[-17.815,31.043],[-17.805,31.061],[-17.79,31.075]]; }
  document.getElementById('loader').style.display='none';
  startAnim();
}

function calcBearing(a,b){
  const y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);
  const x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function dist(a,b){
  const R=6371000; const dLat=(b[0]-a[0])*Math.PI/180; const dLon=(b[1]-a[1])*Math.PI/180;
  const s=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function lerpAngle(a,b,t){ let diff=(b-a+540)%360-180; return (a+diff*t+360)%360; }

function startAnim(){
  routeLine=L.polyline(fullRoute,{color:'#00e676', weight:6, lineCap:'round'}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[80,80]});
  currentBearing=calcBearing(fullRoute[0], fullRoute[1]);
  targetBearing=currentBearing;
  animate();
}

function animate(){
  const cur=fullRoute[idx], nxt=fullRoute[idx+1];
  if(!nxt) return;

  const d=dist(cur,nxt);
  const step=(speed/3.6)/(d*60);
  lerp+=step;

  if(lerp>=1){
    lerp=0; idx++;
    if(idx>=fullRoute.length-1) return;
    targetBearing=calcBearing(fullRoute[idx], fullRoute[idx+1]);
  }

  const lat=cur[0]+(nxt[0]-cur[0])*lerp;
  const lng=cur[1]+(nxt[1]-cur[1])*lerp;

  // NO MARKER MOVEMENT - move map under fixed car
  routeLine.setLatLngs([[lat,lng],...fullRoute.slice(idx+1)]);
  map.setView([lat,lng], map.getZoom(), {animate:false});

  // smooth rotation
  currentBearing=lerpAngle(currentBearing, targetBearing, 0.06);
  document.getElementById('carInner').style.transform=`rotate(${currentBearing}deg)`;

  requestAnimationFrame(animate);
}
loadRoute();
</script>
</body>
</html>
